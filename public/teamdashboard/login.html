<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team dashboard login</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Arimo:wght@400;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#E1DED9;color:#383330;font:16px/1.6 Arimo,Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
.top{background:#A05F50;color:#F4F3F2;padding:12px max(4vw,16px);display:flex;align-items:baseline;gap:8px}
.top i{font:italic 30px/1 'Instrument Serif',Georgia,serif}.top b{font:19px/1 Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.03em}
main{flex:1;display:grid;place-items:center;padding:24px 16px}
.card{background:#313A33;color:#F4F3F2;border-radius:18px;padding:clamp(24px,5vw,44px);width:min(440px,100%)}
.eyb{color:#E6C9C1;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin:0 0 6px}
h1{font:400 clamp(34px,6vw,46px)/1.05 Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:0 0 8px}
h1 em{font:italic 400 1.05em 'Instrument Serif',Georgia,serif;text-transform:none;letter-spacing:0;color:#E6C9C1}
p{margin:0 0 20px;opacity:.9}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
input{width:100%;border:0;border-radius:8px;padding:12px 14px;font-size:16px;min-height:48px;background:#F4F3F2;color:#383330}
input:focus-visible,button:focus-visible{outline:2px solid #E6C9C1;outline-offset:2px}
button{margin-top:14px;width:100%;background:#A05F50;color:#F4F3F2;border:0;border-radius:8px;min-height:48px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
button:hover{background:#834B3F}button:disabled{opacity:.6;cursor:wait}
.err{color:#F1DDD7;background:rgba(168,85,47,.35);border-radius:8px;padding:8px 12px;margin-top:12px;font-size:14px;display:none}
</style>
</head>
<body>
<header class="top"><i>6 figure</i><b>Team dashboard</b></header>
<main>
  <form class="card" id="f">
    <p class="eyb">Private · Farah &amp; Daniel</p>
    <h1>Team <em>dashboard</em></h1>
    <p>The Launch Room and the students log. Enter the team password to open it.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button id="b">Open the dashboard</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>
<script>
{
const f=document.getElementById('f'),b=document.getElementById('b'),err=document.getElementById('err');
f.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';b.disabled=true;b.textContent='Opening…';
  try{const r=await fetch('/api/team/login',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){var n=new URLSearchParams(location.search).get('next')||'';location.href=/^\/teamdashboard\/[a-z0-9\/-]*$/.test(n)?n:'/teamdashboard/';return}
    err.textContent=j.error||'Could not log in. Try again.';err.style.display='block'}
  catch(_){err.textContent='No connection. Check your internet and try again.';err.style.display='block'}
  b.disabled=false;b.textContent='Open the dashboard'});
}
</script>
</body>
</html>
