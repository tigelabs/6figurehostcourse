<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome · 6-Figure Host</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Arimo:wght@400;700&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
.wrap{max-width:860px}
.codebox{background:var(--stone);border-radius:12px;padding:18px;text-align:center;margin:18px 0}
.codebox small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}
.codebox b{font:700 28px "Courier New",monospace;letter-spacing:3px}
.offer{margin-top:34px}
.offer .tag{display:inline-block;background:var(--gold);color:var(--ink);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;padding:4px 10px;border-radius:999px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.g h3{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:22px;margin:0 0 4px}
.g .p{font-family:Anton,Impact,sans-serif;font-size:28px;margin:6px 0 14px}
.g .p s{font-family:Arimo,Arial,sans-serif;font-size:15px;color:var(--muted);margin-left:6px}
.g .ok{display:none;color:var(--green);font-weight:700}
.g.done .btn{display:none}.g.done .ok{display:block}
.note{font-size:13px;color:var(--muted);margin-top:12px}
.msg{display:none;margin-top:14px;padding:12px 14px;border-radius:8px;background:#fff;border-left:4px solid var(--terra)}
@media(max-width:700px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" style="padding-top:56px">
  <div id="wait"><h1>Confirming your <em>payment</em></h1><p class="muted">This takes a few seconds.</p></div>
  <div id="main" style="display:none">
    <div class="card">
      <div class="eyebrow">Payment confirmed</div>
      <h1>Welcome<span id="nm"></span>, you are <em>in</em></h1>
      <p>We sent your personal access code to <b id="em"></b>. Keep it safe: it works on up to 5 devices.</p>
      <div class="codebox"><small>Your access code</small><b id="code"></b></div>
      <a class="btn" id="go" href="/hostcourse/">Open the course</a>
    </div>
    <div class="card" id="got" style="margin-top:18px" hidden><div class="eyebrow">In your library</div><ul class="ticks" id="gotlist" style="margin:8px 0 0"></ul></div>
  </div>
</div>
<div class="foot">Questions? <a href="mailto:contact@6figurehost.com">contact@6figurehost.com</a> · <a href="/privacy">Privacy policy</a></div>
<script>
(function(){
  var sid=new URLSearchParams(location.search).get('session_id');
  function device(){try{var d=localStorage.getItem('sixfig-device');if(!d){d=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());localStorage.setItem('sixfig-device',d)}return d}catch(e){return 'nodevice-'+Date.now()}}
  function $(i){return document.getElementById(i)}
  function msg(t){var m=$('msg');m.style.display='block';m.textContent=t}
  var tries=0;
  function load(){
    fetch('/api/checkout/complete',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({session_id:sid,device:device()})})
    .then(function(r){return r.json()}).then(function(d){
      if(d.pending&&tries++<10){return setTimeout(load,2000)}
      if(!d.code){$('wait').innerHTML='<h1>We could not confirm <em>this order</em></h1><p>If you were charged, your code is on its way by email. Otherwise write to <a href="mailto:contact@6figurehost.com">contact@6figurehost.com</a> and we will sort it out.</p>';return}
      $('wait').style.display='none';$('main').style.display='block';
      $('code').textContent=d.code;$('em').textContent=d.email||'your email';if(d.name)$('nm').textContent=', '+d.name;
      if(d.products.indexOf('course')<0)$('go').setAttribute('href','/hostcourse/guides/'),$('go').textContent='Open your guide';
      var N={course:'6-Figure Host Course',barcelona:'Barcelona Host Guide',bali:'Bali Host Guide'};$('gotlist').innerHTML=d.products.map(function(x){return '<li>'+(N[x]||x)+'</li>'}).join('');$('got').hidden=false;
    }).catch(function(){if(tries++<10)setTimeout(load,2000)});
  }
  if(sid)load();else $('wait').innerHTML='<h1>Nothing to show <em>here</em></h1><p><a href="/checkout">Go to checkout</a></p>';
})();
</script>
</body>
</html>
