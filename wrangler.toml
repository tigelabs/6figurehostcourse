name = "6figurehost-course"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

# KV namespace that stores the access codes. Create it in Cloudflare (Workers & Pages > KV),
# then replace the id below (or bind it in the Pages project settings as "CODES").
[[kv_namespaces]]
binding = "CODES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
